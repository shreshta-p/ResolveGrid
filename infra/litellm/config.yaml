model_list:
  - model_name: local-qwen3
    litellm_params:
      model: ollama/qwen3:14b
      api_base: http://ollama:11434

  # Anthropic primary / OpenAI fallback (approved architecture plan §4).
  # Keys are never in this file -- os.environ/... reads them from the
  # container's environment at request time (see infra/docker-compose.yml's
  # litellm service and this repo's gitignored .env).
  - model_name: cloud-primary
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: cloud-fallback
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  # Phase 11 Task 6: real Prometheus + Grafana observability. LiteLLM only
  # mounts its /metrics endpoint when "prometheus" is a registered success
  # callback (confirmed by reading the installed proxy_server.py's config
  # loader -- ghcr.io/berriai/litellm:main-stable, `if "prometheus" in
  # callback: ... PrometheusLogger._mount_metrics_endpoint()`); without this,
  # /metrics 404s even with valid auth.
  success_callback: ["prometheus"]
  # /metrics defaults to requiring the same Bearer auth as every other proxy
  # route (confirmed: unauthenticated request returns a real 401 naming this
  # exact setting). Prometheus's scrape config has no clean way to inject a
  # secret from .env into a committed prometheus.yml, and this endpoint only
  # exposes counters/histograms (no prompts, no key material), so auth is
  # disabled for it specifically -- a real, deliberate LiteLLM-supported
  # setting, not an app-level workaround.
  require_auth_for_metrics_endpoint: false

router_settings:
  fallbacks:
    - cloud-primary: ["cloud-fallback"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
