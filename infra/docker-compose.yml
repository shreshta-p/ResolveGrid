name: resolvegrid

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resolvegrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resolvegrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolvegrid_dev}
      POSTGRES_DB: ${POSTGRES_DB:-resolvegrid}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-litellm-db.sh:/docker-entrypoint-initdb.d/init-litellm-db.sh:ro
      - ./postgres/init-langfuse-db.sh:/docker-entrypoint-initdb.d/init-langfuse-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resolvegrid} -d ${POSTGRES_DB:-resolvegrid}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: resolvegrid-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.32.15
    container_name: resolvegrid-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # No healthcheck: this image is fully distroless (single "otelcol-contrib" entrypoint
  # binary, no shell, no wget/curl/nc), so there is no in-container tool to probe with.
  # This is a deliberate, understood gap, not an oversight -- Task 9's smoke test must
  # skip health-checking this container by name rather than treat its blank status as ready.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    container_name: resolvegrid-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      # Real Langfuse project API keypair (Phase 11 Task 5) -- the
      # config.yaml `basicauth/langfuse` extension reads these via
      # `${env:...}`. Real values live only in .env, never here.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PROJECT_PUBLIC_KEY:?LANGFUSE_PROJECT_PUBLIC_KEY must be set in .env}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_PROJECT_SECRET_KEY:?LANGFUSE_PROJECT_SECRET_KEY must be set in .env}
    volumes:
      - ./otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      # Phase 11 Task 6: the collector's own real internal self-telemetry
      # (otelcol_receiver_accepted_spans_total etc.), enabled via this
      # config's `service.telemetry.metrics.readers` block -- scraped by the
      # prometheus service below over the compose network, exposed to the
      # host here too for direct verification (`curl localhost:8888/metrics`).
      - "8888:8888"
    depends_on:
      langfuse-web:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: resolvegrid-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # A DEDICATED database, not resolvegrid -- LiteLLM's Prisma startup
      # baselines against whatever database it's pointed at and will DROP any
      # table it doesn't recognize if that database already has a schema with
      # no _prisma_migrations table (exactly what apps/api's Alembic-managed
      # database looks like). This actually happened once during development
      # -- see infra/postgres/init-litellm-db.sh for the full incident note.
      DATABASE_URL: postgresql://${POSTGRES_USER:-resolvegrid}:${POSTGRES_PASSWORD:-resolvegrid_dev}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-resolvegrid-local-dev}
      # Real values live only in this repo's gitignored .env -- never in this
      # file, never in any committed file. Empty string default if unset, not
      # an error, so local dev without cloud keys still works (Ollama-only).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    # No wget/curl in this image (confirmed via `docker exec ... which wget curl`
    # -- both empty) -- same class of gap as otel-collector's distroless image
    # above. Python is available (it's how the proxy itself runs), so use it
    # for the healthcheck instead.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Langfuse (Phase 11 Task 5: real self-hosted trace observability) ---
  #
  # Reuse decisions (see docs/DECISION_LOG.md for the full write-up):
  #  - Postgres: REUSES this compose's shared `postgres` container, via a
  #    dedicated `langfuse` database (infra/postgres/init-langfuse-db.sh),
  #    the exact same "own database, same container" pattern already proven
  #    safe for `litellm` above -- NOT a shared-schema reuse (Prisma
  #    migrate-deploy only ever sees its own tables in a database nothing
  #    else touches).
  #  - Redis: its OWN dedicated container. Langfuse's BullMQ worker requires
  #    `--requirepass` + `maxmemory-policy noeviction` on whatever Redis it
  #    talks to; forcing that auth/eviction-policy change onto the existing
  #    unauthenticated `redis` container (shared by apps/api's arq workers)
  #    would be an invasive, blast-radius-widening change to a resource other
  #    real code already depends on, just to save one small container. Not
  #    worth the risk for a lightweight service.
  #  - ClickHouse, MinIO: neither exists anywhere else in this stack, so both
  #    are new, dedicated containers -- there is nothing safe to reuse.
  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    container_name: resolvegrid-langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?LANGFUSE_CLICKHOUSE_PASSWORD must be set in .env}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:8124:8123"
      - "127.0.0.1:9010:9000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  langfuse-minio:
    # Pinned by digest, not tag: Chainguard's free tier for this image only
    # ever publishes a rolling `latest`/`latest-dev` plus per-build
    # `.sig`/`.att` signature/attestation tags (confirmed via the real
    # registry API -- `GET /v2/chainguard/minio/tags/list` -- no semantic
    # version tag exists to pin to; that's an Enterprise-tier-only feature).
    # A content-addressed digest is the strongest available pin -- immutable
    # by construction, unlike a tag -- and is what `latest` resolved to at
    # the time this was verified (`docker buildx imagetools inspect
    # cgr.dev/chainguard/minio:latest`).
    image: cgr.dev/chainguard/minio@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b
    container_name: resolvegrid-langfuse-minio
    restart: unless-stopped
    entrypoint: sh
    # Pre-creates the 'langfuse' bucket before starting the service, matching
    # Langfuse's own reference docker-compose.yml exactly.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:?LANGFUSE_MINIO_ROOT_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:9020:9000"
      - "127.0.0.1:9021:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s

  langfuse-redis:
    image: docker.io/redis:7
    container_name: resolvegrid-langfuse-redis
    restart: unless-stopped
    command: >
      --requirepass ${LANGFUSE_REDIS_AUTH:?LANGFUSE_REDIS_AUTH must be set in .env}
      --maxmemory-policy noeviction
    environment:
      # Only so the healthcheck below (which runs inside this container) can
      # authenticate -- the actual `--requirepass` value above is what the
      # server enforces; this just hands the same value to the shell that
      # probes it.
      LANGFUSE_REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?LANGFUSE_REDIS_AUTH must be set in .env}
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$LANGFUSE_REDIS_AUTH\" --no-auth-warning ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  langfuse-worker: &langfuse-worker
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    container_name: resolvegrid-langfuse-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    ports:
      # Loopback-only, for local debugging (e.g. hitting the worker's own
      # /api/health or queue-status endpoints directly) -- matches Langfuse's
      # own reference compose, which also publishes this port. Nothing in
      # this stack calls the worker from the host; it's reached only via the
      # container network (Redis-backed queues, not HTTP, from langfuse-web).
      - "127.0.0.1:3031:3030"
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3050
      # Dedicated `langfuse` database inside the SAME postgres container as
      # apps/api/litellm -- see the reuse-decision comment block above.
      DATABASE_URL: postgresql://${POSTGRES_USER:-resolvegrid}:${POSTGRES_PASSWORD:-resolvegrid_dev}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT must be set in .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?LANGFUSE_ENCRYPTION_KEY must be set in .env}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?LANGFUSE_CLICKHOUSE_PASSWORD must be set in .env}
      # Explicit "false" required -- leaving this var entirely unset (rather
      # than passing its own documented default) made the migration runner
      # try to create a ReplicatedMergeTree table, which needs Zookeeper/
      # cluster config this single-node ClickHouse doesn't have. Found via a
      # real failed boot (see docs/DECISION_LOG.md).
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:?LANGFUSE_MINIO_ROOT_PASSWORD must be set in .env}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:?LANGFUSE_MINIO_ROOT_PASSWORD must be set in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?LANGFUSE_REDIS_AUTH must be set in .env}
    healthcheck:
      # Real endpoint, confirmed against the actual pinned :4 image (not
      # guessed): `GET /api/health` on the worker's own port, verified via
      # `docker exec ... wget -qO- http://<container-ip>:3030/api/health` ->
      # `{"status":"ok"}`. Must target the container's OWN IP, not
      # localhost/127.0.0.1 -- this image's server only binds to the
      # container's actual network interface (confirmed via /proc/net/tcp),
      # not loopback, so `wget http://localhost:...` from inside the same
      # container gets a real connection-refused, not a false negative.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$(hostname -i):3030/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  langfuse-web:
    <<: *langfuse-worker
    image: docker.langfuse.com/langfuse/langfuse:4
    container_name: resolvegrid-langfuse-web
    ports:
      - "3050:3000"
    healthcheck:
      # Same "target the container's own IP, not localhost" reasoning as
      # langfuse-worker's healthcheck above. Real endpoint confirmed the same
      # way: `GET /api/public/health` -> `{"status":"OK","version":"4.46.0"}`.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$(hostname -i):3000/api/public/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET must be set in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9020
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      # Headless-init bootstrap (Langfuse's own real, documented non-UI setup
      # path -- https://langfuse.com/self-hosting/administration/headless-initialization):
      # creates a real org/project/user/API-keypair on first boot if they
      # don't already exist. Real values live only in .env (never printed);
      # LANGFUSE_INIT_ORG_ID is REQUIRED for any of the others to take effect.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:?LANGFUSE_INIT_ORG_ID must be set in .env}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-ResolveGrid}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:?LANGFUSE_INIT_PROJECT_ID must be set in .env}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-ResolveGrid-Phase11}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PROJECT_PUBLIC_KEY:?LANGFUSE_PROJECT_PUBLIC_KEY must be set in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_PROJECT_SECRET_KEY:?LANGFUSE_PROJECT_SECRET_KEY must be set in .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?LANGFUSE_INIT_USER_EMAIL must be set in .env}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-ResolveGrid-Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?LANGFUSE_INIT_USER_PASSWORD must be set in .env}
    # No explicit depends_on here -- inherited verbatim from `<<: *langfuse-worker`
    # above (postgres/langfuse-clickhouse/langfuse-minio/langfuse-redis, all
    # service_healthy). Deliberately NOT also depending on langfuse-worker:
    # Langfuse's own reference compose treats web/worker as peers that both
    # depend on the same shared infra, not on each other -- there's no real
    # startup-ordering requirement between them to encode.

  # --- Prometheus + Grafana (Phase 11 Task 6: real metrics observability) ---
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: resolvegrid-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      litellm:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  grafana:
    image: grafana/grafana:13.2.2
    container_name: resolvegrid-grafana
    restart: unless-stopped
    environment:
      # Real values live only in .env, never here/never printed. No
      # anonymous access, no default `admin`/`admin` left in place.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3051:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  ollama_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
  prometheus_data:
  grafana_data:
