name: resolvegrid

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resolvegrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resolvegrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolvegrid_dev}
      POSTGRES_DB: ${POSTGRES_DB:-resolvegrid}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-litellm-db.sh:/docker-entrypoint-initdb.d/init-litellm-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resolvegrid} -d ${POSTGRES_DB:-resolvegrid}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: resolvegrid-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.32.15
    container_name: resolvegrid-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # No healthcheck: this image is fully distroless (single "otelcol-contrib" entrypoint
  # binary, no shell, no wget/curl/nc), so there is no in-container tool to probe with.
  # This is a deliberate, understood gap, not an oversight -- Task 9's smoke test must
  # skip health-checking this container by name rather than treat its blank status as ready.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    container_name: resolvegrid-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: resolvegrid-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # A DEDICATED database, not resolvegrid -- LiteLLM's Prisma startup
      # baselines against whatever database it's pointed at and will DROP any
      # table it doesn't recognize if that database already has a schema with
      # no _prisma_migrations table (exactly what apps/api's Alembic-managed
      # database looks like). This actually happened once during development
      # -- see infra/postgres/init-litellm-db.sh for the full incident note.
      DATABASE_URL: postgresql://${POSTGRES_USER:-resolvegrid}:${POSTGRES_PASSWORD:-resolvegrid_dev}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-resolvegrid-local-dev}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    # No wget/curl in this image (confirmed via `docker exec ... which wget curl`
    # -- both empty) -- same class of gap as otel-collector's distroless image
    # above. Python is available (it's how the proxy itself runs), so use it
    # for the healthcheck instead.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  ollama_data:
