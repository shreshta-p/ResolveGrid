receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

# Phase 11 Task 5: real Langfuse instance (infra/docker-compose.yml's
# langfuse-web/-worker/-clickhouse/-minio/-redis services). Langfuse's own
# OTLP ingestion endpoint (real since self-hosted OSS >= 3.22.0; confirmed
# against the actual v4 image pinned in docker-compose.yml) is HTTP-only --
# "OTLP over HTTP (JSON/protobuf); gRPC is not supported" -- so this uses the
# `otlp_http` exporter (component id `otlp_http/langfuse` below), not `otlp`
# (gRPC), pointed at
# http://langfuse-web:3000/api/public/otel. Auth is HTTP Basic
# (base64(public_key:secret_key)); the `basicauth` extension below builds
# that from plain username/password so no pre-computed base64 secret has to
# live in this file or in .env.
extensions:
  basicauth/langfuse:
    client_auth:
      # Real values injected via this container's own environment (see
      # infra/docker-compose.yml's otel-collector service) -- sourced from
      # .env's LANGFUSE_PROJECT_PUBLIC_KEY/LANGFUSE_PROJECT_SECRET_KEY,
      # never hardcoded here.
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}

exporters:
  debug:
    verbosity: detailed
  otlp_http/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    auth:
      authenticator: basicauth/langfuse
    headers:
      # Langfuse v4: this header is what makes ingested spans appear in
      # real time in the UI/API; without it, ingestion still succeeds but
      # can lag up to ~15 minutes behind.
      x-langfuse-ingestion-version: "4"

service:
  extensions: [basicauth/langfuse]
  # Phase 11 Task 6: real Prometheus + Grafana. This exposes the collector's
  # OWN internal self-telemetry (e.g. otelcol_receiver_accepted_spans_total,
  # otelcol_exporter_sent_spans_total, otelcol_exporter_queue_size) as a real
  # Prometheus-scrapeable endpoint -- confirmed present in this exact pinned
  # image (otel/opentelemetry-collector-contrib:0.159.0) via `otelcol-contrib
  # components`, which lists `prometheus` as a Stable exporter.
  #
  # Deliberately NOT building a full application-metrics pipeline here:
  # apps/api currently emits OTLP TRACES only (no OTel Metrics SDK/MeterProvider
  # anywhere in the codebase -- confirmed via grep). Adding a metrics receiver
  # with nothing real feeding it would mean a pipeline with no genuine data
  # source, which is exactly the kind of "looks configured but isn't real"
  # gap this phase's "nothing mocked" directive rules out. The collector's
  # own internal pipeline-health metrics ARE real and already flowing (every
  # trace this stack sends through it increments these counters), so scraping
  # those is a clean, genuinely real addition within this task's actual scope
  # (infra, not new app instrumentation) -- instrumenting apps/api with the
  # OTel Metrics SDK is a separate, larger change, out of scope for Task 6.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      # Both exporters run: `debug` keeps the existing container-log
      # visibility, `otlp_http/langfuse` is the real, newly-added export to
      # Langfuse -- not a replacement, per the plan's "alongside (or
      # replacing)" wording.
      exporters: [debug, otlp_http/langfuse]
