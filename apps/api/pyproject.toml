[project]
name = "resolvegrid-api"
version = "0.1.0"
description = "ResolveGrid FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "resolvegrid-telemetry",
    "resolvegrid-authz",
    "resolvegrid-contracts",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "faker>=30.0",
]

[tool.uv.sources]
resolvegrid-telemetry = { workspace = true }
resolvegrid-authz = { workspace = true }
resolvegrid-contracts = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolvegrid_api"]
