[project]
name = "resolvegrid-api"
version = "0.1.0"
description = "ResolveGrid FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "resolvegrid-telemetry",
    "resolvegrid-authz",
    "resolvegrid-contracts",
    "resolvegrid-agent-orchestration",
    "resolvegrid-retrieval",
    "resolvegrid-evaluation",
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "faker>=30.0",
    "httpx>=0.27",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "pgvector>=0.3",
    "arq>=0.26",
    "jsonschema>=4.26.0",
    "redis>=5.0",
    "prometheus-client>=0.20",
    # No upper bound pinned, but note for whoever bumps this blind:
    # resolvegrid_api.diagnostic_agent._curry_tool depends on real,
    # confirmed-by-reading-source ADK internals (FunctionTool's
    # inspect.signature()-based schema introspection, BasePlugin.
    # after_model_callback's real shape) that are NOT public API -- see
    # docs/adr/0004-adk-diagnostic-specialist-wiring.md. A version bump that
    # changes that internal behavior would be caught by
    # apps/api/tests/test_diagnostic_agent.py, but re-verify against the
    # ADR's cited findings before trusting a bump blind.
    "google-adk[extensions]>=1.14.1",
]

[tool.uv.sources]
resolvegrid-telemetry = { workspace = true }
resolvegrid-authz = { workspace = true }
resolvegrid-contracts = { workspace = true }
resolvegrid-agent-orchestration = { workspace = true }
resolvegrid-retrieval = { workspace = true }
resolvegrid-evaluation = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolvegrid_api"]
