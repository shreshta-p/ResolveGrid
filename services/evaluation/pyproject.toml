[project]
name = "resolvegrid-evaluation"
version = "0.1.0"
description = "Unified EvalCase schema, JSONL loader, and deterministic/judge graders for ResolveGrid's Phase 10 evaluation harness"
requires-python = ">=3.13"
# Pure library, same dependency-direction rule already established for
# services/retrieval and services/agent-orchestration (see their
# pyproject.toml module-level comments and this package's schema.py module
# docstring): no SQLAlchemy, no resolvegrid_api, no DB-shaped imports at
# all. Only apps/api may depend on resolvegrid-evaluation, never the
# reverse.
dependencies = [
    "pydantic>=2.9",
    # Task 2 (graders.py): grade_schema_validity validates a tool-dimension
    # case's actual_result against the tool's own params_schema. This needs
    # `resolvegrid_contracts.tools.TOOL_REGISTRY` -- a sibling *packages/*
    # library (not apps/api, not DB-shaped), so depending on it does not
    # violate this package's dependency-direction rule (see schema.py's
    # module docstring). `apps/api/src/resolvegrid_api/tool_execution.py`'s
    # `validate_tool_schema` does the equivalent validation but lives in
    # apps/api, which this package must never import -- so the thin
    # `jsonschema.validate(...)` call itself is reimplemented here directly
    # rather than importing across that forbidden boundary. Same
    # `jsonschema` version floor apps/api already pins.
    "resolvegrid-contracts",
    "jsonschema>=4.26.0",
]

[tool.uv.sources]
resolvegrid-contracts = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolvegrid_evaluation"]
