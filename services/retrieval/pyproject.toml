[project]
name = "resolvegrid-retrieval"
version = "0.1.0"
description = "Structure-aware Markdown parsing/chunking for ResolveGrid's Phase 7 knowledge ingestion pipeline"
requires-python = ">=3.13"
# chunker.py/tokenizer.py remain zero-dependency (see
# src/resolvegrid_retrieval/tokenizer.py's module docstring for that
# tradeoff writeup) -- httpx is added here only for embedder.py's real HTTP
# calls to Ollama's `/api/embed` endpoint (Phase 7 Task 3), matching the
# version already used by apps/api/src/resolvegrid_api/llm_gateway.py for
# the same kind of local-model HTTP call.
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolvegrid_retrieval"]
