[project]
name = "resolvegrid-agent-orchestration"
version = "0.1.0"
description = "LangGraph agent workflow orchestration for ResolveGrid"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolvegrid_agent_orchestration"]
