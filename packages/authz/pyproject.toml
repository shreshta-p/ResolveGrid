[project]
name = "resolvegrid-authz"
version = "0.1.0"
description = "Centralized authorization policy module for ResolveGrid"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolvegrid_authz"]
