[project]
name = "resolvegrid-contracts"
version = "0.1.0"
description = "Shared typed contracts (request/response schemas, state machines) for ResolveGrid"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolvegrid_contracts"]
