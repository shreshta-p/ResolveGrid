name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: resolvegrid
          POSTGRES_PASSWORD: resolvegrid_dev
          POSTGRES_DB: resolvegrid
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U resolvegrid -d resolvegrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # apps/api/tests/test_knowledge_store.py's cosine-similarity test (Phase
      # 7 Task 3) calls the real nomic-embed-text embeddings endpoint -- no
      # mocking, by design, since the whole point is verifying real semantic
      # behavior round-trips through pgvector. ollama/ollama's image starts
      # `ollama serve` on its default entrypoint; the model itself still has
      # to be pulled explicitly (see the step below) since a service
      # container's `options` can't run post-start commands.
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
      # apps/api/tests/test_ingestion_worker.py's Arq test (Phase 7 Task 6)
      # enqueues a real job against Redis and runs a real worker to consume
      # it -- no mocking, matching this repo's "no mocking the actual
      # infra" precedent for the Ollama/pgvector integration tests above.
      # Port 6380 matches infra/docker-compose.yml's host mapping for
      # resolvegrid-redis, which REDIS_URL's default also assumes.
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://resolvegrid:resolvegrid_dev@localhost:5433/resolvegrid
      OLLAMA_BASE_URL: http://localhost:11434
      REDIS_URL: redis://localhost:6380/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.13"
      - name: Pull nomic-embed-text into the Ollama service container
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:11434/api/pull -d '{"model": "nomic-embed-text", "stream": false}'
      - run: uv sync --all-packages
      - run: uv run --package resolvegrid-api alembic -c apps/api/alembic.ini upgrade head
      - run: uv run --package resolvegrid-api pytest apps/api/tests -v
      - run: uv run --package resolvegrid-telemetry pytest packages/telemetry/tests -v

  authz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.13"
      - run: uv sync --all-packages
      - run: uv run --package resolvegrid-authz pytest packages/authz/tests -v

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @resolvegrid/web lint
      - run: pnpm --filter @resolvegrid/web typecheck
      - run: pnpm --filter @resolvegrid/web build

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.13"
      - run: uv sync --all-packages
      - run: uv run --package resolvegrid-contracts pytest packages/contracts/tests -v

  agent-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.13"
      - run: uv sync --all-packages
      - run: uv run --package resolvegrid-agent-orchestration pytest services/agent-orchestration/tests -v

  retrieval:
    runs-on: ubuntu-latest
    # Higher than the other uv-based jobs: test_reranker.py (Phase 8 Task 1)
    # downloads a real ~1.1GB bge-reranker-base model on first use, on top
    # of the reranker extra's own torch/transformers download -- budget
    # real time for both rather than the other jobs' 10-minute default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.13"
      # --extra reranker: sentence-transformers/torch/transformers are an
      # optional extra on resolvegrid-retrieval (see its pyproject.toml),
      # not a core dependency or a plain dev-group entry, specifically so
      # every OTHER job's plain `uv sync --all-packages` doesn't pay for a
      # ~200MB torch install it never uses -- only this job, which actually
      # runs reranker.py's real-model tests, opts in explicitly.
      - run: uv sync --all-packages --extra reranker
      - run: uv run --package resolvegrid-retrieval pytest services/retrieval/tests -v
