name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    # 40, not the other jobs' 15: apps/api/tests/test_eval_retrieval.py's
    # reranking-enabled eval test (Phase 8 Task 6) needs the same
    # `--extra reranker` install (sentence-transformers/torch/
    # transformers + a real ~1.1GB bge-reranker-base download on first
    # use) the `retrieval` job below already budgets 15 minutes for on
    # its own, on top of this job's existing DB/Ollama/Redis setup work.
    # Bumped from 25 to 50 for Phase 10 Task 9: a real LiteLLM proxy (see
    # below) now also needs `qwen3:14b` (9.3GB) pulled into the Ollama
    # service container, which this job never previously needed (only
    # the much smaller nomic-embed-text). A first attempt at 40 minutes
    # was NOT enough -- qwen3:14b text generation on this CPU-only runner
    # (no GPU) is far slower than on local dev hardware, and the job was
    # cancelled mid-suite. `apps/api/tests/test_eval_worker.py`'s three
    # real-model tests were subsequently restricted to a small,
    # representative, every-dimension-covered case sample (see that
    # file's `_CI_SAMPLE_CASE_IDS` for the full reasoning) to bring real
    # generation-call volume down to something this runner can finish in
    # reasonable time; 50 minutes leaves real margin above the ~35-minute
    # measured runtime after that fix, without the 90+ minutes a
    # full-volume fix would have needed. See docs/DECISION_LOG.md's
    # 2026-09-11 entry for the full investigation.
    timeout-minutes: 50
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: resolvegrid
          POSTGRES_PASSWORD: resolvegrid_dev
          POSTGRES_DB: resolvegrid
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U resolvegrid -d resolvegrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # apps/api/tests/test_knowledge_store.py's cosine-similarity test (Phase
      # 7 Task 3) calls the real nomic-embed-text embeddings endpoint -- no
      # mocking, by design, since the whole point is verifying real semantic
      # behavior round-trips through pgvector. ollama/ollama's image starts
      # `ollama serve` on its default entrypoint; the model itself still has
      # to be pulled explicitly (see the step below) since a service
      # container's `options` can't run post-start commands.
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
      # apps/api/tests/test_ingestion_worker.py's Arq test (Phase 7 Task 6)
      # enqueues a real job against Redis and runs a real worker to consume
      # it -- no mocking, matching this repo's "no mocking the actual
      # infra" precedent for the Ollama/pgvector integration tests above.
      # Port 6380 matches infra/docker-compose.yml's host mapping for
      # resolvegrid-redis, which REDIS_URL's default also assumes.
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://resolvegrid:resolvegrid_dev@localhost:5433/resolvegrid
      OLLAMA_BASE_URL: http://localhost:11434
      REDIS_URL: redis://localhost:6380/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.13"
      - name: Pull nomic-embed-text and qwen3:14b into the Ollama service container
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:11434/api/pull -d '{"model": "nomic-embed-text", "stream": false}'
          # qwen3:14b (9.3GB) is new to this job as of Phase 10 Task 9 --
          # see the LiteLLM step below for why it's now needed here.
          curl -sf http://localhost:11434/api/pull -d '{"model": "qwen3:14b", "stream": false}'
      # Phase 10 Task 9: apps/api/tests/test_adversarial_suite.py's
      # test_adversarial_injected_document_never_triggers_a_real_tool_call
      # (Phase 10 Task 6) is the first test in this repo's history to call
      # the real /chat endpoint WITHOUT mocking `llm_gateway.complete` --
      # deliberately, since mocking the model's response for a
      # prompt-injection case would be circular (see that test file's
      # module docstring). This means it needs a real, reachable LiteLLM
      # proxy, which this job never provisioned before (every other real-
      # Ollama test in this suite calls Ollama directly for embeddings, or
      # mocks llm_gateway.complete for determinism). Mirrors
      # infra/docker-compose.yml's `litellm` service as closely as CI
      # constraints allow:
      #   - GitHub Actions `services:` containers start before checkout,
      #     so `infra/litellm/config.yaml` (checked-out only once this
      #     step runs) can't be bind-mounted via a `services:` entry --
      #     started as a plain `docker run` step instead, after checkout.
      #   - A DEDICATED `litellm` database, never `resolvegrid` -- per
      #     docs/DECISION_LOG.md's "Prisma shared-DB risk" entry, LiteLLM's
      #     Prisma startup baseline can silently DROP tables it doesn't
      #     recognize in whatever database it's pointed at.
      #   - `--network host` + `--add-host=ollama:127.0.0.1`: the checked
      #     -in config.yaml hardcodes `http://ollama:11434` (Compose's
      #     internal DNS name); host networking plus a manual hosts-file
      #     entry makes that same hostname resolve to this runner's own
      #     loopback, where the `ollama`/`postgres` services already
      #     publish their ports -- no CI-only fork of config.yaml needed.
      #   - Real cloud keys are never available here (they live only in
      #     this repo's gitignored .env) -- ANTHROPIC_API_KEY/
      #     OPENAI_API_KEY are passed empty, matching docker-compose.yml's
      #     own "empty string default if unset, not an error" contract;
      #     this test only exercises the local-qwen3 route, never cloud.
      - name: Start a real LiteLLM proxy for the adversarial suite's one real-model test
        run: |
          psql "postgresql://resolvegrid:resolvegrid_dev@localhost:5433/resolvegrid" -c "CREATE DATABASE litellm"
          docker run -d --name litellm \
            --network host \
            --add-host=ollama:127.0.0.1 \
            -e DATABASE_URL="postgresql://resolvegrid:resolvegrid_dev@localhost:5433/litellm" \
            -e LITELLM_MASTER_KEY="sk-resolvegrid-local-dev" \
            -e ANTHROPIC_API_KEY="" \
            -e OPENAI_API_KEY="" \
            -v "${{ github.workspace }}/infra/litellm/config.yaml:/app/config.yaml:ro" \
            ghcr.io/berriai/litellm:main-stable --config /app/config.yaml --port 4000
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/health/liveliness >/dev/null && break
            sleep 3
          done
          curl -sf http://localhost:4000/health/liveliness
        env:
          PGPASSWORD: resolvegrid_dev
      # --extra reranker: apps/api/tests/test_eval_retrieval.py's
      # reranking-enabled eval test (Phase 8 Task 6) imports
      # resolvegrid_retrieval.reranker, which needs sentence-transformers
      # installed in this shared workspace venv -- see reranker.py's and
      # resolvegrid-retrieval's pyproject.toml's module docstrings for
      # why it's an optional extra, not a core dependency.
      - run: uv sync --all-packages --extra reranker
      - run: uv run --package resolvegrid-api alembic -c apps/api/alembic.ini upgrade head
      - run: uv run --package resolvegrid-api pytest apps/api/tests -v
      - run: uv run --package resolvegrid-telemetry pytest packages/telemetry/tests -v
      - name: Show LiteLLM proxy logs (diagnostic, always run)
        if: always()
        run: docker logs litellm --tail 200 || true

  authz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.13"
      - run: uv sync --all-packages
      - run: uv run --package resolvegrid-authz pytest packages/authz/tests -v

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @resolvegrid/web lint
      - run: pnpm --filter @resolvegrid/web typecheck
      - run: pnpm --filter @resolvegrid/web build

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.13"
      - run: uv sync --all-packages
      - run: uv run --package resolvegrid-contracts pytest packages/contracts/tests -v

  agent-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.13"
      - run: uv sync --all-packages
      - run: uv run --package resolvegrid-agent-orchestration pytest services/agent-orchestration/tests -v

  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.13"
      - run: uv sync --all-packages
      - run: uv run --package resolvegrid-evaluation pytest services/evaluation/tests -v

  retrieval:
    runs-on: ubuntu-latest
    # Higher than the other uv-based jobs: test_reranker.py (Phase 8 Task 1)
    # downloads a real ~1.1GB bge-reranker-base model on first use, on top
    # of the reranker extra's own torch/transformers download -- budget
    # real time for both rather than the other jobs' 10-minute default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.13"
      # --extra reranker: sentence-transformers/torch/transformers are an
      # optional extra on resolvegrid-retrieval (see its pyproject.toml),
      # not a core dependency or a plain dev-group entry, specifically so
      # every OTHER job's plain `uv sync --all-packages` doesn't pay for a
      # ~200MB torch install it never uses -- only this job, which actually
      # runs reranker.py's real-model tests, opts in explicitly.
      - run: uv sync --all-packages --extra reranker
      - run: uv run --package resolvegrid-retrieval pytest services/retrieval/tests -v
